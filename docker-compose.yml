services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/data:/app/data
      - ./backend/firebase-key.json:/app/firebase-key.json:ro

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend